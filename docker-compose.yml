x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://litelink:${POSTGRES_PASSWORD}@db/litelink

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litelink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litelink
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litelink"]
      interval: 3s
      retries: 20

  api:
    <<: *app
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  worker:
    <<: *app
    command: python -m app.worker
    volumes:
      - evals_data:/srv/evals/data  # the collector runs in this service, see the README
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LITELINK_DOMAIN: ${LITELINK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  db_data:
  evals_data:
  caddy_data:
